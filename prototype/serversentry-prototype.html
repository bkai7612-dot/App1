<title>ServerSentry Prototype</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap">
<style>
/* Layout: sticky role bar + app header, single centred column (max 1120px), views swapped in place.
   Single dark look by design (ServerSentry brand: black, purple, iridescent violet). */
:root {
  color-scheme: dark;
  --bg: #08070D; --bg2: #100D19; --card: #171322; --line: #2A2340;
  --purple: #8B5CF6; --violet: #A855F7; --lav: #C4B5FD;
  --text: #F5F3FF; --muted: #A8A2B8;
  --pos: #34D399; --neg: #F87171; --warn: #FBBF24; --info: #7DD3FC;
  --iris: linear-gradient(110deg, #8b5cf6 0%, #d946ef 22%, #6366f1 45%, #22d3ee 62%, #f472b6 80%, #8b5cf6 100%);
  --display: "Space Grotesk", "Segoe UI", system-ui, sans-serif;
  --body: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
}
* { box-sizing: border-box; }
html, body { background: var(--bg); color: var(--text); }
body { font-family: var(--body); font-size: 15px; line-height: 1.55; -webkit-font-smoothing: antialiased; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg2); }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--lav); }
:focus-visible { outline: 2px solid var(--lav); outline-offset: 2px; border-radius: 6px; }
.wrap { max-width: 1120px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
h1, h2, h3 { font-family: var(--display); letter-spacing: -0.01em; text-wrap: balance; margin: 0; }
p { margin: 0; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.tiny { font-size: 12px; }

/* Role bar */
.rolebar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 30; background: #1b1530; border-bottom: 1px solid var(--line); }
.rolebar .wrap { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding-block: 8px; }
.rolebar b { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--lav); }
.roles { display: flex; flex-wrap: wrap; gap: 6px; }
.role { border: 1px solid var(--line); background: transparent; border-radius: 999px; padding: 4px 11px; font-size: 13px; color: var(--muted); cursor: pointer; }
.role[aria-pressed="true"] { background: var(--purple); border-color: var(--purple); color: #fff; }
.rolebar .note { margin-left: auto; font-size: 12px; color: var(--muted); }

/* Header */
header.app { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 45px); z-index: 20; background: rgba(8,7,13,.92); border-bottom: 1px solid rgba(255,255,255,.06); }
header.app .wrap { display: flex; align-items: center; gap: 18px; height: 60px; }
.logo { display: flex; align-items: center; gap: 9px; background: none; border: 0; cursor: pointer; padding: 0; font-family: var(--display); font-weight: 600; font-size: 17px; }
.iris-text { background: var(--iris); background-size: 300% 100%; -webkit-background-clip: text; background-clip: text; color: transparent; animation: shift 12s linear infinite; }
nav.main { display: flex; gap: 2px; }
nav.main button { background: none; border: 0; color: var(--muted); padding: 8px 11px; border-radius: 8px; cursor: pointer; font-size: 14px; position: relative; }
nav.main button:hover { color: var(--text); }
nav.main button[aria-current="page"] { color: #fff; }
nav.main button[aria-current="page"]::after { content: ""; position: absolute; left: 11px; right: 11px; bottom: -1px; height: 2px; border-radius: 2px; background: var(--iris); background-size: 300% 100%; animation: shift 8s linear infinite; }
.who { margin-left: auto; display: flex; align-items: center; gap: 8px; font-size: 13px; }
.avatar { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; font-size: 12px; background: linear-gradient(135deg, var(--purple), #d946ef); }

/* Buttons and inputs */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border-radius: 12px; padding: 10px 16px; font-weight: 600; font-size: 14px; cursor: pointer; border: 1px solid var(--line); background: rgba(255,255,255,.02); color: var(--text); transition: filter .2s, background .2s, border-color .2s; }
.btn:hover { border-color: rgba(139,92,246,.6); background: rgba(139,92,246,.1); }
.btn.primary { border: 0; color: #fff; background: linear-gradient(135deg, #8b5cf6, #a855f7 55%, #7c3aed); box-shadow: 0 8px 30px -10px rgba(168,85,247,.7), inset 0 1px 0 rgba(255,255,255,.2); }
.btn.primary:hover { filter: brightness(1.1); }
.btn.pos { border-color: rgba(52,211,153,.4); background: rgba(52,211,153,.1); color: var(--pos); }
.btn.neg { border-color: rgba(248,113,113,.4); background: rgba(248,113,113,.1); color: var(--neg); }
.btn.sm { padding: 6px 11px; font-size: 12.5px; border-radius: 10px; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.input { width: 100%; border-radius: 12px; border: 1px solid var(--line); background: rgba(8,7,13,.7); padding: 10px 13px; font-size: 14px; }
.input:focus { outline: none; border-color: rgba(139,92,246,.8); box-shadow: 0 0 0 3px rgba(139,92,246,.2); }
label.lbl { display: block; font-size: 11.5px; font-weight: 600; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin-bottom: 6px; }
.field { display: grid; gap: 0; }

/* Surfaces */
.glass { position: relative; background: linear-gradient(180deg, rgba(23,19,34,.92), rgba(16,13,25,.92)); border-radius: 18px; border: 1px solid rgba(196,181,253,.13); }
.pad { padding: 22px; }
.iris { position: relative; border-radius: 18px; }
.iris::before { content: ""; position: absolute; inset: 0; border-radius: inherit; padding: 1.5px; background: var(--iris); background-size: 300% 100%; animation: shift 9s linear infinite; -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor; mask-composite: exclude; pointer-events: none; }
.glow { box-shadow: 0 18px 60px -20px rgba(168,85,247,.55); }
.chip { display: inline-flex; align-items: center; gap: 5px; border: 1px solid var(--line); border-radius: 999px; padding: 2px 10px; font-size: 12px; font-weight: 500; color: var(--muted); white-space: nowrap; }
.chip.ok { color: var(--pos); border-color: rgba(52,211,153,.4); background: rgba(52,211,153,.08); }
.chip.warn { color: var(--warn); border-color: rgba(251,191,36,.4); background: rgba(251,191,36,.08); }
.chip.bad { color: var(--neg); border-color: rgba(248,113,113,.4); background: rgba(248,113,113,.08); }
.chip.info { color: var(--info); border-color: rgba(125,211,252,.4); background: rgba(125,211,252,.08); }
.chip.vio { color: var(--lav); border-color: rgba(139,92,246,.5); background: rgba(139,92,246,.12); }
.notice { border-radius: 12px; padding: 11px 14px; font-size: 13.5px; border: 1px solid rgba(139,92,246,.3); background: rgba(139,92,246,.1); color: var(--lav); }
.notice.warn { border-color: rgba(251,191,36,.3); background: rgba(251,191,36,.08); color: #fde68a; }
.notice.ok { border-color: rgba(52,211,153,.3); background: rgba(52,211,153,.08); color: #a7f3d0; }
.stack { display: grid; gap: 14px; }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.grid2 { display: grid; gap: 18px; grid-template-columns: 1.4fr 1fr; }
.grid2 > * { min-width: 0; }
main { padding-block: 28px 80px; }
.section-title { font-size: 22px; font-weight: 600; margin-bottom: 14px; }

/* Hero */
.hero { position: relative; overflow: hidden; border-bottom: 1px solid rgba(255,255,255,.04); }
.hero canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
.hero .inner { position: relative; text-align: center; padding-block: 64px 56px; }
.hero h1 { font-size: clamp(34px, 6vw, 60px); font-weight: 600; line-height: 1.06; }
.hero .lede { max-width: 640px; margin: 18px auto 0; color: var(--muted); font-size: 17px; }
.searchbar { display: grid; gap: 8px; grid-template-columns: 1.6fr 1fr 1fr auto; padding: 8px; margin: 34px auto 0; max-width: 880px; text-align: left; }
.searchbar .input { border-color: transparent; }

/* Lists */
.result { display: flex; flex-wrap: wrap; gap: 14px; align-items: center; padding: 16px 18px; cursor: pointer; text-align: left; width: 100%; color: inherit; transition: transform .15s, box-shadow .2s; }
.result:hover { transform: translateY(-1px); box-shadow: 0 0 0 1px rgba(139,92,246,.35), 0 8px 40px -12px rgba(139,92,246,.45); }
.result .name { font-family: var(--display); font-size: 18px; font-weight: 600; }
.counts { display: flex; gap: 8px; margin-left: auto; }
.count { border-radius: 10px; padding: 6px 11px; font-weight: 700; font-size: 14px; font-variant-numeric: tabular-nums; }
.count.pos { background: rgba(52,211,153,.1); color: var(--pos); }
.count.neg { background: rgba(248,113,113,.1); color: var(--neg); }
.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); overflow-x: auto; margin-top: 26px; }
.tabs button { background: none; border: 0; padding: 12px 15px; color: var(--muted); cursor: pointer; white-space: nowrap; position: relative; font-size: 14px; }
.tabs button[aria-selected="true"] { color: #fff; }
.tabs button[aria-selected="true"]::after { content: ""; position: absolute; left: 12px; right: 12px; bottom: -1px; height: 2px; background: var(--iris); background-size: 300% 100%; }
dl.stats { margin: 0; }
dl.stats > div { display: flex; justify-content: space-between; gap: 16px; padding: 12px 0; border-top: 1px solid var(--line); }
dl.stats dt { font-size: 14px; } dl.stats dt span { display: block; font-size: 12px; color: var(--muted); }
dl.stats dd { margin: 0; font-family: var(--display); font-size: 18px; font-weight: 600; font-variant-numeric: tabular-nums; }
.big { border-radius: 14px; padding: 14px 16px; }
.big strong { font-family: var(--display); font-size: 30px; display: block; font-variant-numeric: tabular-nums; }
.big.pos { border: 1px solid rgba(52,211,153,.25); background: rgba(52,211,153,.06); color: var(--pos); }
.big.neg { border: 1px solid rgba(248,113,113,.25); background: rgba(248,113,113,.06); color: var(--neg); }
.big span { font-size: 12px; color: var(--muted); }
.lock { text-align: center; padding: 40px 22px; }
.lock .price { font-family: var(--display); font-size: 40px; font-weight: 600; margin-top: 12px; }
.bars { display: flex; align-items: flex-end; gap: 6px; height: 160px; margin-top: 18px; }
.bars .m { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; }
.bars .pair { display: flex; align-items: flex-end; gap: 2px; height: 140px; }
.bars .b { width: 8px; border-radius: 3px 3px 0 0; }
.subtle { background: rgba(8,7,13,.5); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; }
.cat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.cat { border: 1px solid var(--line); border-radius: 12px; padding: 9px 12px; cursor: pointer; font-size: 13.5px; color: var(--muted); background: transparent; text-align: left; }
.cat[aria-pressed="true"] { border-color: rgba(52,211,153,.6); background: rgba(52,211,153,.1); color: var(--pos); }

/* Admin layout */
.admin { display: grid; grid-template-columns: 220px 1fr; gap: 20px; }
.admin > * { min-width: 0; }
.side button { display: block; width: 100%; text-align: left; background: none; border: 0; color: var(--muted); padding: 9px 12px; border-radius: 10px; cursor: pointer; font-size: 14px; }
.side button[aria-current="page"], .side button:hover { background: rgba(255,255,255,.05); color: var(--text); }
.kpis { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); }
.kpi p:first-child { font-size: 11.5px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.kpi p:last-child { font-family: var(--display); font-size: 26px; font-weight: 600; font-variant-numeric: tabular-nums; }
.timeline li { border-left: 2px solid rgba(139,92,246,.4); padding-left: 12px; margin-bottom: 8px; list-style: none; }
.timeline { padding: 0; margin: 0; }

/* Modal + toast */
.scrim { position: fixed; inset: 0; z-index: 60; background: rgba(0,0,0,.7); display: grid; place-items: center; padding: max(16px, env(safe-area-inset-left, 0px)); }
.modal { width: min(520px, 100%); max-height: 86vh; overflow: auto; }
.modal header { display: flex; justify-content: space-between; align-items: center; padding: 16px 20px; border-bottom: 1px solid var(--line); }
.modal .body { padding: 20px; }
.x { background: none; border: 0; color: var(--muted); font-size: 22px; cursor: pointer; line-height: 1; padding: 4px 8px; }
.toast { position: fixed; z-index: 70; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); left: 50%; transform: translateX(-50%); background: #1f1933; border: 1px solid rgba(139,92,246,.5); border-radius: 12px; padding: 11px 16px; font-size: 14px; box-shadow: 0 10px 40px -10px rgba(0,0,0,.8); max-width: calc(100vw - 32px); }

footer { border-top: 1px solid rgba(255,255,255,.06); padding-block: 26px; color: var(--muted); font-size: 12.5px; }

@keyframes shift { to { background-position: 300% 50%; } }
@media (max-width: 860px) {
  nav.main { display: none; }
  .searchbar { grid-template-columns: 1fr; }
  .grid2, .admin { grid-template-columns: 1fr; }
  .side { display: flex; overflow-x: auto; gap: 4px; }
  .side button { white-space: nowrap; width: auto; }
  .rolebar .note { display: none; }
  header.app { top: calc(env(safe-area-inset-top, 0px) + 82px); }
}
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>

const logMod = (a, t) => DB.log.push({ a, t, at: new Date() });

// ---------- Actions ----------
function needSignIn() { toast("Choose a member role in the View as bar to do this."); }

    <button class="btn pos" id="cmsend">Submit commendation</button></div>`, (m) => {
    m.querySelectorAll(".cat").forEach((b) => b.addEventListener("click", () => { cat = b.dataset.cat; m.querySelectorAll(".cat").forEach((x) => x.setAttribute("aria-pressed", x === b)); }));
    m.querySelector("#cmsend").addEventListener("click", () => {
      const key = `${S.role}:${p.id}:${cat}`;
      if (S.given.has(key)) { toast("You've already given this player that commendation."); return; }
      S.given.add(key);
      const comment = m.querySelector("#cm")?.value.trim() ?? "";
      if (comment) { DB.pendingComments.push({ id: ++seq, pid: p.id, cat, comment, by: NAMES[S.role] }); closeModal(); toast("Thanks! Your commendation counts once a moderator approves the comment."); }
      else { (DB.comms[p.id] ??= []).unshift(C(cat, null, 0)); closeModal(); toast("Thanks! Your commendation is live."); }
      render();
    });
  });
}
function reportModal() {
  if (!signedIn()) return needSignIn();
  const p = profile(S.pid);
  if (DB.reports.some((r) => r.pid === p.id && r.mine === S.role && ["submitted", "under_review"].includes(r.status))) { toast("You already have an open report about this player."); return; }
  modal(`Report ${p.name}`, `<form class="stack" id="rf"><div class="notice">Reports are private. Nothing is published unless a moderator reviews it and writes a neutral summary. Your identity is never shown.</div>
    <label class="field"><span class="lbl">Category</span><select class="input" id="rc">${Object.entries(REP_CATS).map(([k, v]) => `<option value="${k}">${v}</option>`).join("")}</select></label>

function commentModal() {

document.addEventListener("click", (e) => {
  const t = e.target.closest("button, [data-go], [data-role]"); if (!t) return;
  const ds = t.dataset;
  if (ds.role) { S.role = ds.role; if (S.view === "admin" && ds.role !== "mod") S.view = "home"; if (S.view === "me" && ds.role === "guest") S.view = "home"; render(); toast(`Now viewing as ${ROLES.find((r) => r[0] === ds.role)[1]}.`); return; }
  if (ds.go) { go(ds.go, ds.go === "admin" ? { adminView: "overview" } : {}); return; }
  if (ds.open) { go("profile", { pid: ds.open, tab: "overview" }); return; }
  if (ds.tab) { S.tab = ds.tab; render(); return; }
  if (ds.searchGame) { S.search = { q: "", game: ds.searchGame, platform: "" }; go("search"); return; }
  if (ds.act === "commend") return commendModal();
  if (ds.act === "report") return reportModal();
  if (ds.act === "upgrade") return upgradeModal();
  if (ds.act === "comment") return commentModal();
  if (ds.vote) {
    const p = profile(S.pid), key = `${S.role}:${p.id}`, val = +ds.vote, prev = S.myVotes[key] ?? 0, v = DB.votes[p.id];
    if (prev === 1) v.up--; if (prev === -1) v.down--;
    const next = prev === val ? 0 : val; if (next === 1) v.up++; if (next === -1) v.down++;
    S.myVotes[key] = next; render(); toast(next === 0 ? "Vote removed." : next === 1 ? "Upvoted." : "Downvoted."); return;
  }
  if (ds.dispute) { const c = DB.comments.find((x) => x.id === +ds.dispute); return textModal("Report comment as inaccurate", "Why is this comment inaccurate?", 10, (v) => { c.dispute = "open"; c.disputeReason = v; toast("Sent to moderators. Switch to Moderator to review it."); }, "Explain what is wrong."); }
  if (ds.cmt) {
    const c = DB.comments.find((x) => x.id === +ds.cid);
    if (ds.cmt === "approve") { c.status = "approved"; logMod("Approved comment and added to account", profile(c.pid).name); render(); toast("Comment approved: it now appears on the player's account."); return; }
    return textModal(ds.cmt === "reject" ? "Reject comment" : "Remove comment from account", "Reason (recorded)", 5, () => { c.status = ds.cmt === "reject" ? "rejected" : "removed"; logMod(ds.cmt === "reject" ? "Rejected comment" : "Removed comment", profile(c.pid).name); toast(ds.cmt === "reject" ? "Comment rejected." : "Comment removed from the account."); });
  }
  if (ds.dsp) {
    const c = DB.comments.find((x) => x.id === +ds.cid);
    return textModal(ds.dsp === "remove" ? "Remove disputed comment" : "Keep comment", "Reason (shown to the account owner)", 5, () => { if (ds.dsp === "remove") { c.status = "removed"; c.dispute = "removed"; } else c.dispute = "kept"; logMod(ds.dsp === "remove" ? "Upheld inaccuracy report: comment removed" : "Inaccuracy report reviewed: comment kept", profile(c.pid).name); toast(ds.dsp === "remove" ? "Comment removed. The owner has been notified." : "Comment kept. The owner has been notified."); });
  }
  if (ds.act === "claim") { toast("Claim submitted. Ownership is never granted on a matching username; Steam uses its official sign-in, other platforms are reviewed by a moderator."); return; }
  if (ds.respond) { const r = DB.reports.find((x) => x.id === +ds.respond); return textModal("Your public response", "Response (moderated before display)", 10, (v) => { r.response = v; r.responseStatus = "pending"; toast("Response sent for moderation."); }); }
  if (ds.appeal) { const r = DB.reports.find((x) => x.id === +ds.appeal); return textModal("Appeal this report", "Grounds for appeal (private to moderators)", 20, (v) => { r.appeal = v; r.status = "appealed"; toast("Appeal submitted. A senior moderator who didn't publish it will decide."); }); }
  if (ds.admin) { S.adminView = ds.admin; render(); return; }
  if (ds.rid) { S.adminView = "report"; S.rid = +ds.rid; render(); return; }
  if (ds.mod) {
    const r = DB.reports.find((x) => x.id === S.rid);
    if (ds.mod === "start") { r.status = "under_review"; logMod("Started review", r.ref); render(); }
    if (ds.mod === "info") return textModal("Request more information", "Question for the reporter", 10, () => { logMod("Requested information", r.ref); toast("The reporter has been asked for more information."); });
    if (ds.mod === "reject") return textModal("Reject report", "Reason (recorded)", 5, () => { r.status = "rejected"; logMod("Rejected report", r.ref); S.adminView = "reports"; toast(`${r.ref} rejected.`); });
    if (ds.mod === "publish") return textModal("Publish as allegation", "Neutral public summary (no personal data, framed as an allegation)", 20, (v) => { r.status = "published"; r.summary = v; r.days = 0; logMod("Published report", r.ref); S.adminView = "reports"; toast(`${r.ref} published. The player's −count updates and they're notified.`); }, "A community member alleges that this player…");
    return;
  }
  if (ds.cm) {
    const i = DB.pendingComments.findIndex((c) => c.id === +ds.cid), c = DB.pendingComments[i]; DB.pendingComments.splice(i, 1);
    if (ds.cm !== "reject") (DB.comms[c.pid] ??= []).unshift(C(c.cat, ds.cm === "approve" ? c.comment : null, 0));
    logMod(ds.cm === "reject" ? "Rejected commendation comment" : "Approved commendation", profile(c.pid).name); render(); return;
  }
  if (ds.resp) { const r = DB.reports.find((x) => x.id === +ds.rid2); if (ds.resp === "publish") { r.responseStatus = "published"; if (r.status === "published") r.status = "disputed"; } else { r.response = null; r.responseStatus = null; } logMod(ds.resp === "publish" ? "Published player response" : "Rejected player response", r.ref); render(); return; }
  if (ds.ap) { const r = DB.reports.find((x) => x.id === +ds.rid2); if (ds.ap === "uphold") { r.status = "removed"; } else { r.status = "resolved"; r.outcome = "Appeal reviewed by a senior moderator; the report was upheld."; } logMod(ds.ap === "uphold" ? "Upheld appeal" : "Rejected appeal", r.ref); render(); return; }
});
document.addEventListener("submit", (e) => {
  if (e.target.id !== "searchform") return;
  e.preventDefault();
  S.search = { q: document.getElementById("q").value, game: document.getElementById("g").value, platform: document.getElementById("p").value };
  go("search");
});

// ---------- Iridescent wave background ----------
let raf;
function waves() {
  cancelAnimationFrame(raf);
  const cv = document.getElementById("waves"); if (!cv) return;
  const ctx = cv.getContext("2d"), still = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const size = () => { cv.width = cv.offsetWidth * devicePixelRatio; cv.height = cv.offsetHeight * devicePixelRatio; };
  size(); addEventListener("resize", size, { once: true });
  const draw = (t) => {
    const w = cv.width, h = cv.height; ctx.clearRect(0, 0, w, h);
    const g = ctx.createRadialGradient(w * .2, h * .1, 0, w * .2, h * .1, w * .55); g.addColorStop(0, "rgba(139,92,246,.35)"); g.addColorStop(1, "rgba(139,92,246,0)"); ctx.fillStyle = g; ctx.fillRect(0, 0, w, h);
    const g2 = ctx.createRadialGradient(w * .85, h * .2, 0, w * .85, h * .2, w * .4); g2.addColorStop(0, "rgba(217,70,239,.22)"); g2.addColorStop(1, "rgba(217,70,239,0)"); ctx.fillStyle = g2; ctx.fillRect(0, 0, w, h);
    const lines = [[.42, 1, 0], [.5, .7, 1.7], [.58, .5, 3.1]];
    lines.forEach(([y, a, ph], i) => {
      const grad = ctx.createLinearGradient(0, 0, w, 0);
      const shift = ((t / 9000) + i * .2) % 1;
      ["#8b5cf6", "#d946ef", "#6366f1", "#22d3ee", "#f472b6", "#8b5cf6"].forEach((c, k) => grad.addColorStop(((k / 5) + shift) % 1, c));
      ctx.strokeStyle = grad; ctx.globalAlpha = a * .7; ctx.lineWidth = (2 - i * .4) * devicePixelRatio; ctx.beginPath();
      for (let x = 0; x <= w; x += 8) { const yy = h * y + Math.sin(x / w * Math.PI * 3 + t / 2400 + ph) * h * .08 + Math.sin(x / w * Math.PI * 7 + t / 3100) * h * .02; x ? ctx.lineTo(x, yy) : ctx.moveTo(x, yy); }
      ctx.stroke(); ctx.globalAlpha = 1;
    });
    const fade = ctx.createLinearGradient(0, h * .55, 0, h); fade.addColorStop(0, "rgba(8,7,13,0)"); fade.addColorStop(1, "rgba(8,7,13,1)"); ctx.fillStyle = fade; ctx.fillRect(0, 0, w, h);
    if (!still) raf = requestAnimationFrame(draw);
  };
  draw(0);
}

function render() {
  renderChrome();
  document.getElementById("app").innerHTML = (V[S.view] ?? V.home)();
  if (S.view === "home") waves();
}
render();
